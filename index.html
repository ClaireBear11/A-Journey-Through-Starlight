<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Journey Through Starlight — Claire Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDIT HERE: colors / fonts
   ============================================================ */
:root{
  --bg:#0b0d12;          /* page background */
  --bg-soft:#12151c;     /* frame background before image loads */
  --line:#1e222c;        /* divider lines */
  --ink:#eceadf;         /* bright headings */
  --body:#c9c6bb;        /* body / caption text */
  --muted:#8a8f9c;       /* faint text (italic notes) */
  --data:#9a8c6a;        /* gold data labels (object name, gear) */
  --accent:#c98a5a;      /* warm accent */
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--body);
  font-family:var(--sans);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img,video{display:block;width:100%;height:100%;object-fit:cover;}

/* ---------- HERO ---------- */
.hero{
  position:relative;            /* positioning context for the starfield */
  min-height:70vh;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;
  padding:6rem 2rem 4rem;
  margin:0 auto;
  overflow:hidden;              /* keep the starfield + photo motion inside */
  background-color:#05060a;
}
/* YOUR Milky Way photo — its own layer so it can slowly drift/zoom (Ken Burns) */
.hero-bg{
  position:absolute;inset:-6%;z-index:0;pointer-events:none;
  background-image:url("images/milkyway-hero.jpg");
  background-size:cover;background-position:center center;
  will-change:transform;
  animation:kenburns 30s ease-in-out infinite alternate;
}
@keyframes kenburns{
  0%  {transform:scale(1.08) translate(-3.5%, 2.2%);}
  100%{transform:scale(1.22) translate(3.5%, -2.2%);}
}
/* scintillation shimmer — makes the real stars in the photo feel alive */
.hero-shimmer{
  position:absolute;inset:0;z-index:0;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(ellipse 60% 50% at 50% 50%, rgba(120,140,180,.16), transparent 70%);
  animation:shimmer 6s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{opacity:.3;}50%{opacity:.85;}}
/* soft vignette + gradient so the title stays legible over the photo */
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at center, rgba(6,8,14,0) 45%, rgba(6,8,14,.45) 100%),
    linear-gradient(to bottom, rgba(6,8,14,.35) 0%, rgba(6,8,14,.05) 35%, rgba(6,8,14,.05) 65%, rgba(6,8,14,.55) 100%);
}
/* starfield sits over the photo, full-bleed across the whole hero */
#stars{
  position:absolute;inset:0;width:100%;height:100%;
  z-index:1;pointer-events:none;
}
/* mouse-tracking glow — sits above starfield, below text */
.hero-glow{
  position:absolute;top:0;left:0;width:60vmax;height:60vmax;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle closest-side,
      rgba(201,138,90,.16), rgba(201,138,90,.06) 45%, transparent 70%);
  z-index:0;pointer-events:none;
  opacity:0;transition:opacity 1.2s ease;
  will-change:left,top;
}
.hero-glow.on{opacity:1;}
/* all hero text/badge sits above the photo + starfield, constrained to a centered column */
.hero > *:not(#stars):not(.hero-glow):not(.hero-bg):not(.hero-shimmer){position:relative;z-index:2;max-width:1100px;margin-left:auto;margin-right:auto;text-align:center;}

/* text fade-in on load: each line rises + fades, staggered */
.hero .eyebrow,.hero h1,.hero .sub,.hero .byline{
  opacity:0;transform:translateY(18px);
  animation:heroIn .9s cubic-bezier(.2,.6,.2,1) forwards;
}
.hero h1{animation-delay:.15s;}
.hero .sub{animation-delay:.40s;}
.hero .byline{animation-delay:.65s;}
.hero .hero-actions{animation-delay:.90s;}
@keyframes heroIn{to{opacity:1;transform:none;}}

/* hero buttons */
.hero-actions{
  display:flex;gap:1rem;margin-top:2.6rem;flex-wrap:wrap;justify-content:center;
  opacity:0;transform:translateY(18px);
  animation:heroIn .9s cubic-bezier(.2,.6,.2,1) forwards;
}
.btn{
  display:inline-flex;align-items:center;
  padding:.7rem 1.5rem;
  font-family:var(--sans);font-size:.85rem;letter-spacing:.14em;
  text-transform:uppercase;text-decoration:none;
  color:var(--data);
  border:1px solid var(--data);border-radius:2px;
  background:transparent;cursor:pointer;
  transition:background .35s ease,color .35s ease,box-shadow .35s ease;
}
.btn:hover,.btn:focus-visible{
  background:rgba(154,140,106,.14);      /* faint gold fill */
  color:var(--ink);
  box-shadow:0 0 22px rgba(154,140,106,.22);
  outline:none;
}

.hero .eyebrow{
  color:var(--data);font-size:.95rem;letter-spacing:.28em;
  text-transform:uppercase;margin-bottom:1.4rem;
}
.hero h1{
  font-family:'Orbitron',Georgia,serif;font-weight:500;
  /* Orbitron is wide; cap the size so the one-line title fits its container
     and stays truly centered instead of overflowing to the right */
  font-size:clamp(1.1rem,4.4vw,3.1rem);
  color:var(--ink);line-height:1.05;letter-spacing:-.01em;
  white-space:nowrap;      /* keep title on ONE line */
  text-align:center;max-width:100%;
  margin-left:auto;margin-right:auto;
}
.hero .sub{
  font-family:var(--sans);              /* same family + treatment as the byline */
  font-size:clamp(.75rem,2.7vw,1.4rem);
  letter-spacing:.18em;text-transform:uppercase;   /* match the byline */
  color:rgba(255,255,255,.55);          /* white, fainter — like the "faint light" it references */
  margin-top:2.6rem;
  white-space:nowrap;      /* keep subtitle on ONE line */
  text-align:center;max-width:100%;margin-left:auto;margin-right:auto;
}
.hero .byline{
  margin-top:7rem;color:var(--data);font-size:1rem;   /* pushes byline + buttons further down */
  letter-spacing:.18em;text-transform:uppercase;
}

/* ---------- SECTION HEADINGS ---------- */
/* lives INSIDE .gallery (which already has the 2rem side padding),
   so it needs NO horizontal padding of its own — this makes the heading
   text and its underline line up exactly with the image edges. */
.section-head{margin:0;padding:0;}
.section-head:not(:first-child){margin-top:2rem;}
.section-head .eyebrow{
  display:block;color:var(--data);font-size:.85rem;
  letter-spacing:.22em;text-transform:uppercase;margin-bottom:.7rem;
  font-family:var(--sans);
}
.section-head h2{
  font-family:'Orbitron',Georgia,serif;font-weight:500;color:var(--ink);
  font-size:clamp(1.4rem,3vw,2.1rem);letter-spacing:.01em;
  padding-bottom:1rem;margin-bottom:3.5rem;border-bottom:1px solid var(--line);
}
@media(max-width:720px){
  .section-head h2{margin-bottom:2.5rem;}
}

/* ---------- GALLERY ---------- */
.gallery{max-width:1100px;margin:0 auto;padding:4rem 2rem 6rem;}

.plate{
  margin-bottom:6rem;
  /* opacity + drift are set live by JavaScript as you scroll */
  will-change:opacity,transform;
}

/* photo frame */
.frame{
  border-radius:10px;overflow:hidden;background:var(--bg-soft);
  cursor:zoom-in;position:relative;
}
.frame::after{ /* subtle inner border */
  content:"";position:absolute;inset:0;border-radius:10px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);pointer-events:none;
}
.frame img{transition:transform 1.2s cubic-bezier(.2,.6,.2,1);}
.frame:hover img{transform:scale(1.04);}   /* slow zoom on hover */

/* caption */
.cap{margin-top:1.1rem;}
.cap .obj{
  color:var(--data);font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:.5rem;
}
.cap .obj .gear{color:var(--muted);text-transform:none;letter-spacing:.04em;}
.cap .text{
  font-family:var(--serif);color:var(--body);
  font-size:1.02rem;line-height:1.65;
}
.cap .note{
  display:block;color:var(--muted);font-style:italic;
  font-size:.95rem;margin-top:.5rem;
}

/* layout variants: wide (big landscape) / tall (portrait) / duo (2-up) */
.wide .frame{aspect-ratio:16/9;}
.tall .frame{aspect-ratio:4/5;}

.duo{
  display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;
  margin-bottom:6rem;
}
.duo .plate{margin-bottom:0;}
.duo .frame{aspect-ratio:1;}
.duo .cap .text{font-size:.98rem;}

/* compare: header + full-width caption, then two labeled photos side by side */
.compare{margin-bottom:6rem;}
.compare-title{
  font-family:var(--serif);font-weight:400;
  color:var(--data);                       /* gold header */
  font-size:clamp(1.5rem,3vw,2.2rem);
  text-align:left;margin-bottom:1rem;letter-spacing:.01em;
}
.compare .shared-cap{
  font-family:var(--serif);color:var(--body);
  font-size:1.05rem;line-height:1.7;
  text-align:left;                         /* full width, no early wrap */
  margin-top:1.6rem;                       /* sits below the image pair */
}
.compare .pair{
  display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;
}
.compare .item .frame{aspect-ratio:1;}
.compare .meta{
  margin-top:.9rem;
  color:var(--data);font-size:.7rem;letter-spacing:.14em;
  text-transform:uppercase;line-height:1.7;text-align:left;
}
.compare .meta .row{display:block;}
.compare .meta .k{color:var(--data);}          /* label like SCOPE / DATE */
.compare .meta .v{color:var(--muted);text-transform:none;letter-spacing:.03em;}
/* object name: clean gold lettering, matching the other photos' labels */
.compare .meta .obj-name .v{
  color:var(--data);text-transform:uppercase;letter-spacing:.14em;
}
@media(max-width:600px){
  .compare .pair{grid-template-columns:1fr;gap:2rem;}
}

/* ---------- LIGHTBOX (click a photo to enlarge) ---------- */
.lb{
  position:fixed;inset:0;background:rgba(4,5,8,.95);
  display:none;align-items:center;justify-content:center;
  z-index:100;padding:2rem;cursor:zoom-out;
}
.lb.open{display:flex;}
.lb img{
  max-width:92vw;max-height:82vh;width:auto;height:auto;
  object-fit:contain;border-radius:6px;
}
.lb .lb-cap{
  position:absolute;bottom:1.6rem;left:0;right:0;text-align:center;
  color:var(--muted);font-family:var(--serif);font-style:italic;
  font-size:.9rem;padding:0 2rem;
}
.lb .lb-close{
  position:absolute;top:1.4rem;right:1.8rem;color:var(--muted);
  font-size:1.8rem;background:none;border:none;cursor:pointer;
  line-height:1;
}
.lb .lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);
  font-size:2.4rem;cursor:pointer;padding:1rem;user-select:none;
}
.lb .lb-prev{left:.5rem;}
.lb .lb-next{right:.5rem;}
.lb-nav:hover,.lb-close:hover{color:var(--ink);}

/* ---------- FOOTER ---------- */
.foot{
  max-width:1100px;margin:0 auto;padding:3rem 2rem 5rem;
  border-top:1px solid var(--line);text-align:center;
  color:var(--muted);font-size:.8rem;letter-spacing:.05em;
}

/* ---------- RESPONSIVE (phone) ---------- */
@media(max-width:720px){
  .hero{padding:4.5rem 1.4rem 3rem;min-height:60vh;}
  .gallery{padding:3rem 1.4rem 4rem;}
  .plate{margin-bottom:4rem;}
  .duo{grid-template-columns:1fr;gap:4rem;margin-bottom:4rem;}  /* 2-up becomes 1 column */
  .lb .lb-nav{font-size:1.8rem;padding:.5rem;}
}
@media(prefers-reduced-motion:reduce){
  .plate{opacity:1 !important;transform:none !important;}
  .frame img{transition:none;}
  html{scroll-behavior:auto;}
  .hero-glow{display:none;}
  .hero-bg,.hero-shimmer{animation:none;}
}
</style>
</head>

/* ---- match the title's width to the subtitle's width ----
   Scales "A Journey Through Starlight" so its left/right edges line up
   exactly with "Several years ... driveway." on every screen size.      */
(function(){
  const title = document.getElementById('heroTitle');
  const sub    = document.getElementById('heroSub');
  if(!title || !sub) return;

  function fitTitle(){
    // reset to the CSS size first, then measure both natural widths
    title.style.fontSize = '';
    const subW   = sub.getBoundingClientRect().width;
    const titleW = title.getBoundingClientRect().width;
    if(titleW === 0 || subW === 0) return;
    const current = parseFloat(getComputedStyle(title).fontSize);
    // scale so the title's width equals the subtitle's width
    title.style.fontSize = (current * (subW / titleW)) + 'px';
  }

  window.addEventListener('resize', fitTitle);
  window.addEventListener('load', fitTitle);
  // re-run once the Orbitron webfont has actually loaded (it loads async)
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(fitTitle); }
  fitTitle();
})();

/* placeholder gradients shown when a photo has no src yet */
const PLACEHOLDER = [
  'radial-gradient(circle at 40% 38%,#c97b4a,#7a3a1f 32%,#14100c 78%)',
  'radial-gradient(ellipse at 50% 50%,#d4a94a,#8a6a2a 28%,#1a1610 72%)',
  'radial-gradient(circle at 55% 45%,#b23b3b,#6a1f2a 32%,#140a10 80%)',
  'radial-gradient(ellipse at 45% 40%,#e8e4d8,#b8b0a0 18%,#2a2620 68%)',
  'radial-gradient(circle at 50% 45%,#6a7bb0,#2a3560 40%,#0d1020 82%)'
];

function frameHTML(p,i){
  let inner;
  if(!p.src){
    inner = `<div style="width:100%;height:100%;background:${PLACEHOLDER[i%PLACEHOLDER.length]}"></div>`;
  } else if(/\.mp4$/i.test(p.src)){
    inner = `<video src="${p.src}" autoplay muted loop playsinline></video>`;
  } else {
    inner = `<img src="${p.src}" alt="${p.obj}">`;
  }
  return `<div class="frame" data-i="${i}">${inner}</div>`;
}
function capHTML(p){
  const gear = p.gear ? ` <span class="gear">· ${p.gear}</span>` : '';
  const date = p.date ? ` <span class="gear">· ${p.date}</span>` : '';
  const note = p.note ? `<span class="note">${p.note}</span>` : '';
  return `<div class="cap"><p class="obj">${p.obj}${gear}${date}</p>`+
         `<p class="text">${p.text}${note}</p></div>`;
}

/* one side of a compare pair: image + a small object/scope/date label */
function compareItemHTML(side,i,ph){
  const alt = [side.obj, side.scope, side.date].filter(Boolean).join(' · ');
  const inner = side.src
    ? `<img src="${side.src}" alt="${alt}">`
    : `<div style="width:100%;height:100%;background:${PLACEHOLDER[ph%PLACEHOLDER.length]}"></div>`;
  const meta =
    `<div class="meta">`+
      (side.obj  ? `<span class="row obj-name"><span class="v">${side.obj}</span></span>`   : ``)+
      (side.scope? `<span class="row"><span class="k">Scope</span> <span class="v">${side.scope}</span></span>` : ``)+
      (side.date ? `<span class="row"><span class="k">Date</span> <span class="v">${side.date}</span></span>`   : ``)+
    `</div>`;
  return `<div class="item"><div class="frame" data-i="${i}">${inner}</div>${meta}</div>`;
}

/* pair up "duo" photos two at a time; render compare specially; else single plate */
let html='', i=0;
while(i<PHOTOS.length){
  const p=PHOTOS[i];
  // section heading: printed whenever a photo declares one
  if(p.section){
    html+=`<div class="section-head"><span class="eyebrow">${p.section.eyebrow||''}</span>`+
          `<h2>${p.section.title||''}</h2></div>`;
  }
  if(p.layout==='compare'){
    html+=`<div class="plate compare">`+
      `<div class="pair">`+
        compareItemHTML(p.left, i, i)+
        compareItemHTML(p.right, i, i+1)+
      `</div>`+
      `<p class="shared-cap">${p.text||''}</p>`+
      `</div>`;
    i++;
  }else if(p.layout==='duo' && PHOTOS[i+1] && PHOTOS[i+1].layout==='duo'){
    html+=`<div class="duo">`+
      `<div class="plate">${frameHTML(p,i)}${capHTML(p)}</div>`+
      `<div class="plate">${frameHTML(PHOTOS[i+1],i+1)}${capHTML(PHOTOS[i+1])}</div>`+
      `</div>`;
    i+=2;
  }else{
    const cls = p.layout==='tall' ? 'tall' : 'wide';
    html+=`<div class="plate ${cls}">${frameHTML(p,i)}${capHTML(p)}</div>`;
    i++;
  }
}
gallery.innerHTML=html;

/* ---- scroll-driven fade + drift (both directions) ----
   For each plate we look at where its center sits in the viewport.
   - Centered in the middle band  -> fully visible, no drift
   - Approaching from the bottom   -> faded, shifted DOWN (rises up as it enters)
   - Leaving past the top          -> faded, shifted UP  (sinks away as it exits)
*/
const plates = Array.from(document.querySelectorAll('.plate'));
const DRIFT = 60;   // how far (px) items drift in/out. bigger = more movement
const BAND  = 0.6;  // fraction of screen height that stays fully visible (center band)

/* respect reduced-motion: skip the scroll animation entirely */
const REDUCE = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function updateScroll(){
  if(REDUCE) return;
  const vh = window.innerHeight;
  for(const el of plates){
    const r = el.getBoundingClientRect();
    const center = r.top + r.height/2;        // plate's center, relative to viewport
    const fromMid = (center - vh/2) / (vh/2); // -1 = at top edge, 0 = middle, +1 = at bottom edge

    // within the center band -> fully shown
    const t = Math.max(-1, Math.min(1, fromMid));
    const edge = Math.max(0, (Math.abs(t) - (1 - BAND)) / BAND); // 0 in band, ramps to 1 at edges

    const opacity = 1 - edge;                 // fade out toward both edges
    const drift = t * edge * DRIFT;           // +down when entering (bottom), -up when leaving (top)
    el.style.opacity = opacity.toFixed(3);
    el.style.transform = `translateY(${drift.toFixed(1)}px)`;
  }
}

/* run on scroll/resize, throttled with requestAnimationFrame for smoothness */
let ticking=false;
function onScroll(){
  if(!ticking){ requestAnimationFrame(()=>{updateScroll();ticking=false;}); ticking=true; }
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);
window.addEventListener('load',updateScroll);
updateScroll();  // set initial state right away

/* lightbox — works off the actual <img>s on the page, so it supports
   regular photos, duos, and compare pairs alike */
const lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),
      lbCap=document.getElementById('lbCap');
let lbList=[], cur=0;

function collectImages(){
  // every real image inside a frame, in visual order
  lbList = Array.from(document.querySelectorAll('.frame img'));
}
function openByEl(imgEl){
  collectImages();
  const idx = lbList.indexOf(imgEl);
  if(idx<0) return;
  showLB(idx);
}
function showLB(idx){
  cur=idx;
  const img=lbList[idx];
  lbImg.src=img.src;lbImg.alt=img.alt||'';
  lbCap.textContent=img.alt||'';
  lb.classList.add('open');
}
function closeLB(){lb.classList.remove('open');lbImg.src='';}
function step(d){
  if(!lbList.length) return;
  cur=(cur+d+lbList.length)%lbList.length;
  showLB(cur);
}
gallery.addEventListener('click',e=>{
  const img=e.target.closest('.frame')?.querySelector('img');
  if(img) openByEl(img);
});
document.getElementById('lbClose').addEventListener('click',closeLB);
document.getElementById('lbPrev').addEventListener('click',e=>{e.stopPropagation();step(-1);});
document.getElementById('lbNext').addEventListener('click',e=>{e.stopPropagation();step(1);});
lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
});

/* ============================================================
   HERO — photo background with a live starfield over it.
   Your Milky Way photo (images/milkyway-hero.jpg) drifts slowly (CSS Ken Burns);
   these canvas stars twinkle + drift + parallax on top. No shooting stars.
   ============================================================ */
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  const hero = document.querySelector('.hero');
  const bg   = document.querySelector('.hero-bg');
  const canvas = document.getElementById('stars'); if(!canvas) return;
  const ctx = canvas.getContext('2d');

  /* ---- CONFIG ---- */
  const STAR_DENSITY=0.00026;
  const DRIFT_X=0.11, DRIFT_Y=0.04, TWINKLE=1.1, PARALLAX=34, EASE=0.07;
  const BRIGHT_FRACTION=0.09;

  const COLORS=[[202,225,255],[230,240,255],[255,255,255],[255,245,230],[255,225,185],[255,200,160]];
  const CW=[0.12,0.18,0.28,0.22,0.13,0.07];
  function pick(){let r=Math.random(),a=0;for(let i=0;i<COLORS.length;i++){a+=CW[i];if(r<=a)return COLORS[i];}return COLORS[2];}

  const LAYERS=[
    {depth:0.4,size:0.7,bright:0.6,tw:0.7,dr:0.6},
    {depth:0.8,size:1.0,bright:0.85,tw:1.2,dr:1.0},
    {depth:1.3,size:1.4,bright:1.05,tw:1.7,dr:1.3}
  ];
  let W,H,stars=[]; const dpr=Math.min(window.devicePixelRatio||1,2); let mx=0,my=0,tx=0,ty=0;

  function resize(){
    W=hero.clientWidth;H=hero.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H*STAR_DENSITY);stars=[];
    for(let i=0;i<n;i++){const L=LAYERS[i%LAYERS.length];const br=Math.random()<BRIGHT_FRACTION;
      stars.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.0+0.3)*L.size*(br?2:1),
        base:(Math.random()*0.5+0.3)*L.bright*(br?1.3:1),phase:Math.random()*Math.PI*2,
        speed:(Math.random()*0.8+0.4)*L.tw,col:pick(),br,L});}
  }
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-0.5)*2;ty=((e.clientY-r.top)/r.height-0.5)*2;});
  hero.addEventListener('pointerleave',()=>{tx=0;ty=0;});

  function star(s,x,y,a){const[r,g,b]=s.col;const rad=s.r*(s.br?3:2.2);
    const grd=ctx.createRadialGradient(x,y,0,x,y,rad);
    grd.addColorStop(0,`rgba(${r},${g},${b},${a})`);grd.addColorStop(0.3,`rgba(${r},${g},${b},${a*0.45})`);grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=`rgba(${r},${g},${b},${Math.min(1,a*1.05)})`;ctx.beginPath();ctx.arc(x,y,s.r*0.55,0,Math.PI*2);ctx.fill();}

  let t=0;
  function frame(){t++;mx+=(tx-mx)*EASE;my+=(ty-my)*EASE;
    if(bg) bg.style.marginLeft=(-mx*20)+'px', bg.style.marginTop=(-my*20)+'px';
    ctx.clearRect(0,0,W,H);
    for(const s of stars){s.x+=DRIFT_X*s.L.depth*s.L.dr;s.y+=DRIFT_Y*s.L.depth*s.L.dr;
      if(s.x>W+20)s.x=-20;if(s.x<-20)s.x=W+20;if(s.y>H+20)s.y=-20;
      const ox=-mx*PARALLAX*s.L.depth,oy=-my*PARALLAX*s.L.depth;
      const tw=s.base+Math.sin(t*0.02*s.speed+s.phase)*TWINKLE*0.4*s.L.tw;
      star(s,s.x+ox,s.y+oy,Math.max(0,Math.min(1,tw)));}
    requestAnimationFrame(frame);}

  resize();window.addEventListener('resize',resize);
  if(!reduce) requestAnimationFrame(frame);
  else for(const s of stars) star(s,s.x,s.y,s.base);
})();
</script>
