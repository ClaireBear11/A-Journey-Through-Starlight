<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Telescope — Claire Lee</title>
<style>
:root{
  --bg:#0b0d12; --bg-soft:#12151c; --line:#1e222c;
  --ink:#eceadf; --body:#c9c6bb; --muted:#8a8f9c;
  --data:#9a8c6a; --accent:#c98a5a;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--body);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}

.topnav{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:2rem 2rem 0;}
.topnav a{color:var(--muted);text-decoration:none;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;transition:color .3s;}
.topnav a:hover{color:var(--ink);}

.hero{position:relative;overflow:hidden;min-height:48vh;display:flex;flex-direction:column;justify-content:center;padding:4rem 2rem 3rem;margin:0 auto;}
#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.hero > *:not(#stars){position:relative;z-index:1;max-width:900px;width:100%;margin-left:auto;margin-right:auto;}
.hero .eyebrow{color:var(--data);font-size:.9rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:1.2rem;
  opacity:0;transform:translateY(18px);animation:heroIn .9s cubic-bezier(.2,.6,.2,1) .15s forwards;}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,6vw,4rem);color:var(--ink);line-height:1.05;
  opacity:0;transform:translateY(18px);animation:heroIn .9s cubic-bezier(.2,.6,.2,1) .35s forwards;}
@keyframes heroIn{to{opacity:1;transform:none;}}

.content{max-width:720px;margin:0 auto;padding:2rem 2rem 6rem;}
.content .lead{font-family:var(--serif);font-size:1.3rem;color:var(--ink);line-height:1.6;margin-bottom:2.5rem;}
.content h2{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:1.5rem;margin:2.5rem 0 1rem;}
.content p{margin-bottom:1.4rem;font-size:1.05rem;}
.content .photo{width:100%;border-radius:10px;margin:2rem 0;background:var(--bg-soft);aspect-ratio:3/2;object-fit:cover;}

/* spec table */
.specs{width:100%;border-collapse:collapse;margin:1.5rem 0 2.5rem;}
.specs td{padding:.85rem 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:1rem;}
.specs td:first-child{color:var(--data);width:38%;padding-right:1rem;letter-spacing:.04em;}
.specs td:last-child{color:var(--body);}

.placeholder-note{color:var(--data);font-style:italic;font-family:var(--serif);border-left:2px solid var(--data);padding-left:1rem;margin:1.4rem 0;opacity:.8;}
.foot{max-width:720px;margin:0 auto;padding:2rem;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.05em;}
.foot a{color:var(--data);text-decoration:none;}
.foot a:hover{color:var(--ink);}

@media(max-width:600px){.hero{min-height:40vh;padding:3rem 1.4rem 2rem;}.content{padding:1.5rem 1.4rem 4rem;}}
@media(prefers-reduced-motion:reduce){.hero .eyebrow,.hero h1{opacity:1 !important;transform:none !important;animation:none;}html{scroll-behavior:auto;}}
/* ---- two telescope cards ---- */
.scopes{
  max-width:900px;margin:0 auto;padding:1rem 2rem 2rem;
  display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;
}
.scope-card .frame{
  border-radius:10px;overflow:hidden;background:var(--bg-soft);
  aspect-ratio:4/5;
}
.scope-card .frame img{width:100%;height:100%;object-fit:cover;}
.scope-card h3{
  font-family:var(--serif);font-weight:400;color:var(--ink);
  font-size:1.35rem;margin:1.2rem 0 .8rem;
}
.scope-card .row{
  display:flex;justify-content:space-between;gap:1rem;
  padding:.6rem 0;border-bottom:1px solid var(--line);font-size:.95rem;
}
.scope-card .row .k{color:var(--data);letter-spacing:.04em;white-space:nowrap;}
.scope-card .row .v{color:var(--body);text-align:right;}
.scope-card .buy{
  display:inline-block;margin-top:1.1rem;
  color:var(--data);text-decoration:none;font-size:.82rem;
  letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--data);border-radius:2px;padding:.55rem 1.1rem;
  transition:background .3s,color .3s;
}
.scope-card .buy:hover{background:rgba(154,140,106,.14);color:var(--ink);}
@media(max-width:600px){.scopes{grid-template-columns:1fr;gap:3rem;}}

/* ---- moving carousel ---- */
.carousel-wrap{max-width:1100px;margin:3rem auto 0;padding:0 2rem;}
.carousel-wrap h2{
  font-family:var(--serif);font-weight:400;color:var(--ink);
  font-size:1.5rem;margin-bottom:1.5rem;max-width:900px;
  margin-left:auto;margin-right:auto;
}
.carousel{overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}
.carousel-track{display:flex;gap:1.5rem;width:max-content;
  animation:scrollX 40s linear infinite;}
.carousel:hover .carousel-track{animation-play-state:paused;}
.carousel-track img{
  height:320px;width:auto;border-radius:10px;object-fit:cover;
  background:var(--bg-soft);flex:0 0 auto;
}
@keyframes scrollX{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media(max-width:600px){.carousel-track img{height:220px;}}
@media(prefers-reduced-motion:reduce){.carousel-track{animation:none;}}
</style>
</head>
<body>

<script>
document.getElementById('year').textContent=new Date().getFullYear();
(function(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const canvas=document.getElementById('stars'); if(!canvas) return;
  const ctx=canvas.getContext('2d'), hero=document.querySelector('.hero');
  const DENSITY=0.00022, DX=0.10, DY=0.03, TW=0.5;
  let W,H,stars=[]; const dpr=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    W=hero.clientWidth;H=hero.clientHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H*DENSITY);stars=[];
    for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+0.3,base:Math.random()*0.5+0.35,phase:Math.random()*Math.PI*2,speed:Math.random()*0.8+0.4});
  }
  let t=0;
  function frame(){
    t++;ctx.clearRect(0,0,W,H);
    for(const s of stars){
      s.x+=DX;s.y+=DY;if(s.x>W)s.x=0;if(s.y>H)s.y=0;
      const a=Math.max(0,Math.min(1,s.base+Math.sin(t*0.02*s.speed+s.phase)*TW*0.35));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(235,238,245,${a})`;ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();window.addEventListener('resize',resize);requestAnimationFrame(frame);
})();
</script>
